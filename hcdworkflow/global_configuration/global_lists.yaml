algorithm:
    default:
        [equilibrium_solver,ec_wave_solver,lh_wave_solver,ic_coup,ic_wave_solver,nbi_source,nuclear_source,ec_wave_fp,ic_wave_fp,nbi_fp,nuclear_fp,fill_core_sources,fill_core_profiles]
    nbi_ic_synergy:
        [equilibrium_solver,ec_wave_solver,lh_wave_solver,nbi_source,nbi_fp,nuclear_source,nuclear_fp,ic_coup,ic_wave_solver,ec_wave_fp,ic_wave_fp,fill_core_sources,fill_core_profiles]

prerequisites:
   equilibrium_solver: None
   ec_wave_solver: None
   lh_wave_solver: None
   ic_coup: None
   ic_wave_solver: None
   ec_wave_fp:
       ec_wave_solver: any
   ic_wave_fp:
       stixredist:
          ic_wave_solver: any
       fopla:
          ic_wave_solver: any
          nbi_source: any
          nbi_fp: any
   nbi_source: None
   nbi_fp:
       risk:
         nbi_source: [nemo, bbnbi_serial, bbnbi_parallel]
       spot:
         nbi_source: [nemo, bbnbi_serial, bbnbi_parallel]
       ascot_serial:
         nbi_source: [nemo, bbnbi_serial, bbnbi_parallel]
       ascot_parallel:
         nbi_source: [nemo, bbnbi_serial, bbnbi_parallel]
       nbisim:
         nbi_source: [nemo, bbnbi_serial, bbnbi_parallel]
   nuclear_source: None
   nuclear_fp:
       ascot_serial:
          nuclear_source: [bbnbi_serial, bbnbi_parallel]
       ascot_parallel:
          nuclear_source: [bbnbi_serial, bbnbi_parallel]
   fill_core_sources: None
   fill_core_profiles: None

parallel_dependency:
   ec_wave_solver:             None
   lh_wave_solver:             None
   ic_coup:                    None
   ic_wave_solver:             [ic_coup,nbi_source,nbi_fp,nuclear_source,nuclear_fp,merge_distributions,merge_distribution_sources]
   ec_wave_fp:                 [ec_wave_solver]
   ic_wave_fp:                 [ic_wave_solver]
   nbi_source:                 None
   nbi_fp:                     [nbi_source]
   nuclear_source:             None
   nuclear_fp:                 [nuclear_source]
   fill_core_sources:          [ec_wave_solver,lh_wave_solver,ic_wave_solver,ec_wave_fp,ic_wave_fp,nbi_source,nbi_fp,nuclear_source,nuclear_fp,merge_waves,merge_distributions,merge_distribution_sources]
   fill_core_profiles:         [ec_wave_fp,ic_wave_fp,nbi_fp,nuclear_fp,merge_distributions]
   merge_distributions:        [ec_wave_fp,ic_wave_fp,nbi_fp,nuclear_fp,merge_distributions]
   merge_waves:                [ec_wave_solver,lh_wave_solver,ic_wave_solver,ic_coup,merge_waves]
   merge_distribution_sources: [nbi_source,nuclear_source,merge_distribution_sources]

exec_types:
   ctypes
   mpi_local
   mpi_batch

device: ITER

wall_md:
  shot:          116000
  run:           2
  user_or_path:  public
  database:      ITER_MD
  backend:       HDF5


waveform_presets:
  ec:
     custom:  ['ec_waveforms.yaml','Custom']
     preset1: ['ec_launchers_standard_Omode_mirrors.yaml','O-mode']
     preset2: ['ec_launchers_standard_Xmode_mirrors.yaml','X-mode']
  lh:
     custom:  ['lh_waveforms.yaml','Custom']
     preset1: ['None','Default']
  ic:
     custom:  ['ic_waveforms.yaml','nbi_waveforms.yaml','Custom']
     preset1: ['ic_53MHz_default.yaml','53 MHz']
  nbi:
     custom:  ['nbi_waveforms.yaml','Custom']
     preset1: ['nbi_D_1MeV_off_off.yaml','D 1MeV off-off']
     preset2: ['nbi_D_1MeV_off_on.yaml','D 1MeV off-on']
     preset3: ['nbi_D_1MeV_on_on.yaml','D 1MeV on-on']
     preset4: ['nbi_H_870keV_off_off.yaml','H 870keV off-off']
     preset5: ['nbi_H_870keV_off_on.yaml','H 870keV off-on']
     preset6: ['nbi_H_870keV_on_on.yaml','H 870keV on-on']
