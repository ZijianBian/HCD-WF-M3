# deps.yaml - external dependencies of the HCD workflow CI, read by ci-sdcc/resolve_deps.sh
# (modules) and ci-sdcc/st02-build-actors.sh (actor sources).
#
# Every module dependency is a module: official (site tree /work/imas/etc/modules/all, searched first)
# or built by us into the user tree (module_paths, searched after the site tree; a user-built module
# never reuses an official name).
# Every key outside `interactive:` is used by both CI and interactive runs; CI never builds modules.
#
# Keys
#   module_paths                         user module trees, appended after the site tree (module use -a)
#   combinations.<combo>.modules         modules loaded in the listed order; they build and run all
#                                        actors of actor_install/ used by the CI cases
#   combinations.<combo>.interactive_modules
#                                        interactive tools loaded after them (interactive runs only;
#                                        a missing one gives a warning)
#   checks                               commands run once the environment is complete (a failure is an error)
#   components.<DIR>.{repo,ref}          source of each actor built by ci-sdcc/st02-build-actors.sh:
#                                        <DIR> is the SOURCES DIR of the actor_install/*.yml files, repo must
#                                        equal their REPO, ref (branch, tag or commit) replaces their VERSION
#   interactive.easybuild_module         module providing eb when it is not already available
#   interactive.easyconfigs              <module name>: <recipe>; a missing module with a recipe is built
#                                        into the user tree, then loaded
#   interactive.src_overrides.<VAR>      when VAR is exported, the source tree it names replaces the
#                                        modules of family `replaces` (tree on PYTHONPATH, root_env=<tree>)
#
# Environment variables
#   COMBO          both         combination to use (CI: set in the task)
#   DEPS_MODE      both         'interactive' for interactive runs, unset (= CI) everywhere else
#   MODULES        CI only      transition: module list passed by old plans, replaces the modules of
#                               the families it names
#   ACTOR_VERSIONS both         optional DIR=REF pairs applied on top of components (local tests)
#   DEPS_FILE      both         manifest path (default: the nearest deps.yaml at or above ci-sdcc/)
#   CI_DEPS_DIR    both         directory of env.sh (default ./ci-deps)

module_paths:
  - /work/projects/pds/stack/modules/all

combinations:
