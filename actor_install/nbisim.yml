SOURCES:
  - VCS:     git
    REPO:    ssh://git@git.iter.org/heat/nbisim.git
    VERSION: develop
    DIR:     nbisim

MODULES: [IMAS-AL-Fortran, IMAS-AL-Python, iWrap, INTERPOS, XMLlib]

BUILDS: 
  - DIR: nbisim
    CMD: make -C devel/ veryclean veryclean-deps DATAMODEL=IMAS DEBUG=yes FC=ifort

ACTORS: 
  - DIR: nbisim
    CMD: make -C devel/ iwrap_actor FC=ifort DEBUG=yes

