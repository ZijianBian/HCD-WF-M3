#example
---
SOURCES:
  - VCS:     git
    REPO:    ssh://git@git.iter.org/heat/lion.git
    VERSION: develop
    DIR:     lion

MODULES: [IMAS-AL-Fortran, IMAS-AL-Python, iWrap, INTERPOS, XMLlib]

BUILDS: 
  - DIR: lion
    CMD: make -C src_f90/ clean veryclean libraries IMAS_ENVIRONMENT_LOADED=yes DEBUG=no F90=ifort

ACTORS: 
  - DIR: lion
    CMD: make -C src_f90/ iwrap_actor IMAS_ENVIRONMENT_LOADED=yes DEBUG=no F90=ifort

