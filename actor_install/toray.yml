#example
---
SOURCES:
  - VCS:  git
    REPO: ssh://git@git.iter.org/heat/toray.git
    VERSION: develop
    DIR: toray

MODULES: [IMAS-AL-Fortran, IMAS-AL-Python, iWrap, XMLlib]

BUILDS: 
  - DIR: toray
    CMD:
      - cd lib/nag && FC=ifort ./naglib.mk
      - cd lib/netlib && FC=ifort ./netlib.mk
      - cd lib/ppplib && FC=ifort ./ppplib.mk
      - FC=ifort make -f make/makefile_imas clean libtoray.a 

ACTORS: 
  - DIR: toray
    CMD: make -f make/makefile_imas actor FC=ifort

