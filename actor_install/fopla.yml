#example
---
SOURCES:
  - VCS:  git
    REPO: ssh://git@git.iter.org/heat/fopla.git
    # branch feature/DD3_and_DD4 (DD 3.42.2 and DD 4.1.1, IMAS-Fortran 5.6.0)
    VERSION: feature/DD3_and_DD4
    DIR: fopla

MODULES: [IMAS-Python, iWrap, INTERPOS, XMLlib, IMAS-Fortran]

BUILDS: 
  - DIR: fopla
    CMD: make veryclean validate clean library DEBUG=yes FC="$FC"

ACTORS: 
  # the Makefile picks the iWrap yaml fopla_<FC>[_dd3].yaml from FC and the Data Dictionary version
  - DIR: fopla
    CMD: MAKEFLAGS=-j1 MFLAGS= make iwrap_actor DEBUG=yes FC="$FC"

