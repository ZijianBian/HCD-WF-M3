#example
---
SOURCES:
  - VCS:     git
    REPO:    ssh://git@git.iter.org/traj/ascot.git
    VERSION: master
    DIR:     ascot

MODULES: [IMAS-AL-Fortran, IMAS-AL-Python, iWrap, XMLlib, AMNS]

BUILDS: 
  - DIR: ascot
    CMD: ./build.sh

ACTORS: 
  - DIR: ascot
    CMD: 
      - iwrap -f actors/afsi.yaml -i "$ACTOR_FOLDER"
      - iwrap -f actors/ascot4_serial.yaml -i "$ACTOR_FOLDER"
      - iwrap -f actors/ascot4_parallel.yaml -i "$ACTOR_FOLDER"
      - iwrap -f actors/ascot4rfof_serial.yaml -i "$ACTOR_FOLDER"
      - iwrap -f actors/ascot4rfof_parallel.yaml -i "$ACTOR_FOLDER"
      - iwrap -f actors/bbnbi_serial.yaml -i "$ACTOR_FOLDER"
      - iwrap -f actors/bbnbi_parallel.yaml -i "$ACTOR_FOLDER" 
