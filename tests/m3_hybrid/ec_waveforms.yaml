# ----------------------------------------------------------------
# THIS FILE IS AIMED AT CONFIGURING THE DYNAMIC DATA OF AN IDS
# PREVIOUSLY READ FROM THE MACHINE DESCRIPTION DATABASE... OR NOT
# ----------------------------------------------------------------
 
# -------------------------------------------------------------------------------------------------------
# CONFIGURATION RULES:
# --------------------
# - IF SHOT = O, IDS CREATED FROM SCRACTH, OTHERWISE IT IS READ FROM THE MD DATABASE
# - IF NO TIME ARRAY IS DEFINED FOR A SPECIFIC VARIABLE, IT USES THE GENERAL ONE INSTEAD
# - THE TIME ARRAY OF A SPECIFIC VARIABLE HAS TO BE DEFINED AFTER THE SPECIFIC VARIABLE
# --------------------
# - ADVICE: DO NOT REMOVE VARIABLES (EXCEPT TIME ARRAYS), COMMENT THEM OUT INSTEAD
# - NOTE:   THE ACCESS LAYER MAY NOT NOTICE A DIMENSION MISTAKE
# - CAVEAT: MAKE SURE THE DIMENSION OF THE VARIABLE IS THE SAME AS THE ASSOCIATED TIME ARRAY
#          (EXCEPTION: IF THE VARIABLE HAS JUST ONE VALUE, IT IS DUPLICATED OVER THE GENERAL TIME ARRAY)
# -------------------------------------------------------------------------------------------------------
 
