name: linting-and-code-formatting

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint with ruff
        uses: astral-sh/ruff-action@v4
        with:
          args: check

      - name: Check formatting with ruff
        run: ruff format --check --diff
