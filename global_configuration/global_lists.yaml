ids_list:
    core_profiles 
    core_sources 
    equilibrium  
    pulse_schedule  
    nbi  
    ic_antennas  
    ec_launchers 
    wall  
    distribution_sources  
    distributions  
    waves

actor_list:
    afsi
    ascot4parallel 
    ascot4serial 
    bbnbi 
    Cyrano 
    genray 
    gray
    grayscale
    hcd2core_sources 
    hcd2core_profiles  
    iccoup 
    lion
    nbisim2
    nemo 
    pion 
    risk 
    spot 
    StixReDist 
    tomcat 
    torbeam
    fopla

merge_actor_list:
    merge_waves
    merge_distributions
    merge_distribution_sources
    merge_core_sources

algorithm:
    default:
        [ec_wave_solver,ic_coup,ic_wave_solver,nbi_source,nuclear_source,ic_wave_fp,nbi_fp,nuclear_fp,fill_core_sources,fill_core_profiles]
    nbi_ic_synergy:
        [ec_wave_solver,nbi_source,nbi_fp,nuclear_source,nuclear_fp,ic_coup,ic_wave_solver,ic_wave_fp,fill_core_sources,fill_core_profiles]

pre_requisites:
   ec_wave_solver: None
   ic_coup: None
   ic_wave_solver: None
   ic_wave_fp:
       StixReDist:
          ic_wave_solver: any
       fopla:
          nbi_source: any
          nbi_fp: any
   nbi_source: None
   nbi_fp:
       risk:
          nbi_source: [nemo, bbnbi]
       spot:
          nbi_source: [nemo, bbnbi]
   nuclear_source: None
   nuclear_fp: None
   fill_core_sources: None
   fill_core_profiles: None

extra_arguments:
   risk:   [dt_required]
   spot:   [dt_required]
   pion:   [tbegin,tend,dt_required]
   iccoup: [ic_wave_nr_toroidal_modes]
   bbnbi:  [nmarkers_bbnbi_ascot]

parallel_dependency:
   ec_wave_solver:             None
   ic_coup:                    None
   ic_wave_solver:             [ic_coup,nbi_source,nbi_fp,nuclear_source,nuclear_fp,merge_waves,merge_distributions,merge_distribution_sources]
   ic_wave_fp:                 [ic_wave_solver,merge_waves]
   nbi_source:                 None
   nbi_fp:                     [nbi_source,merge_distribution_sources]
   nuclear_source:             None
   nuclear_fp:                 [nuclear_source,merge_distribution_sources]
   fill_core_sources:          [ec_wave_solver,ic_wave_solver,ic_wave_fp,nbi_source,nbi_fp,nuclear_source,nuclear_fp,merge_waves,merge_distributions,merge_distribution_sources]
   fill_core_profiles:         [ic_wave_fp,nbi_fp,nuclear_fp,merge_distributions]
   merge_distributions:        [ic_wave_fp,nbi_fp,nuclear_fp,merge_distributions]
   merge_waves:                [ec_wave_solver,ic_wave_solver,ic_coup,merge_waves]
   merge_distribution_sources: [nbi_source,nuclear_source,merge_distribution_sources]

