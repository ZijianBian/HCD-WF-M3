[aliases]
test=pytest

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    HCDWorkflow.egg-info,
    .venv,
    envs

[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py

[pylint]
max-line-length = 120
disable = E0401
ignore = _version.py

[pylint.MASTER]
ignore = _version.py

[pylint.FORMAT]
max-line-length = 120

[pylint.MESSAGES CONTROL]
disable = E0401

[ruff]
select = F401, E402
line-length = 120
exclude = .git,__pycache__,build,dist,*.egg-info
